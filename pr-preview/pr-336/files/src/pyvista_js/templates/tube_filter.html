<script type="module">
// @ts-check
/// <reference path="vtk.d.ts" />

let {{ TUBED_PD }}: any;
(function () {
  const {{ TUBE_FILTER }} = vtk.Filters.General.vtkTubeFilter.newInstance({
    radius: {{ RADIUS }},
    numberOfSides: {{ N_SIDES }},
    capping: {{ CAPPING }}
  });
  const src: any = {{ SOURCE }};
  if (typeof src.update === 'function') { src.update(); }
  if (typeof src.getOutputPort === 'function') {
    {{ TUBE_FILTER }}.setInputConnection(src.getOutputPort());
  } else {
    {{ TUBE_FILTER }}.setInputData(src);
  }
  {{ TUBE_FILTER }}.update();
  {{ TUBED_PD }} = {{ TUBE_FILTER }}.getOutputData();
})();
</script>
