<script type="module">
// @ts-check
/// <reference path="vtk.d.ts" />

  (function () {
    const container: HTMLDivElement = document.createElement("div");
    container.id = "{{ CONTAINER_ID }}";
    container.setAttribute("data-background-r", "{{ BACKGROUND_R }}");
    container.setAttribute("data-background-g", "{{ BACKGROUND_G }}");
    container.setAttribute("data-background-b", "{{ BACKGROUND_B }}");
    container.style.cssText =
      "width:600px;height:400px;border:2px solid #333;position:relative";
    if (typeof element !== "undefined" && element) {
      element.appendChild(container);
    } else {
      document.body.appendChild(container);
    }

    function doRender(): void {
      try {
        const backgroundR: number = parseFloat(container.dataset.backgroundR || "0");
        const backgroundG: number = parseFloat(container.dataset.backgroundG || "0");
        const backgroundB: number = parseFloat(container.dataset.backgroundB || "0");

        const renderer = vtk.Rendering.Core.vtkRenderer.newInstance();
        renderer.setBackground(backgroundR, backgroundG, backgroundB);
        const renderWindow = vtk.Rendering.Core.vtkRenderWindow.newInstance();
        renderWindow.addRenderer(renderer);
        const openGLRenderWindow =
          vtk.Rendering.OpenGL.vtkRenderWindow.newInstance();
        renderWindow.addView(openGLRenderWindow);
        openGLRenderWindow.setContainer(container);
        const bbox: DOMRect = container.getBoundingClientRect();
        openGLRenderWindow.setSize(bbox.width || 600, bbox.height || 400);
        const interactor =
          vtk.Rendering.Core.vtkRenderWindowInteractor.newInstance();
        const interactorStyle =
          vtk.Interaction.Style.vtkInteractorStyleTrackballCamera.newInstance();
        interactor.setInteractorStyle(interactorStyle);
        interactor.setView(openGLRenderWindow);
        interactor.initialize();
        interactor.bindEvents(container);

        {{ LIGHTS_CODE }}

        {{ ACTORS_CODE }}

        {{ SCALAR_BAR_CODE }}

        {{ TEXT_ACTORS_CODE }}

        {{ ENVIRONMENT_CODE }}

        {{ AXES_CODE }}

        renderer.resetCamera();
        {{ CAMERA_CODE }}
        renderWindow.render();
      } catch (e) {
        console.error("Error rendering vtk.js scene:", e);
      }
    }

    if (typeof vtk !== "undefined") {
      doRender();
    } else {
      const script: HTMLScriptElement = document.createElement("script");
      script.src = "{{ VTKJS_CDN }}";
      script.onload = doRender;
      document.head.appendChild(script);
    }
  })();
</script>
