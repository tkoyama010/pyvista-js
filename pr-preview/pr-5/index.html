<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pyvista-js Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #root {
            width: 100%;
            height: 100vh;
        }
        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Loading pyvista-js demo...</div>
    <div id="root"></div>
    <script type="module">
        import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.js";
        
        try {
            // Get the directory where this HTML is located
            const baseUrl = new URL('.', window.location.href).href;
            
            // Load app.py from same directory
            const response = await fetch(new URL('app.py', baseUrl));
            if (!response.ok) {
                throw new Error(`Failed to load app.py: ${response.status}`);
            }
            const appCode = await response.text();
            
            // Hide loading message
            document.getElementById('loading').style.display = 'none';
            
            mount({
                requirements: [],
                entrypoint: "app.py",
                files: {
                    "app.py": appCode
                }
            }, document.getElementById("root"));
        } catch (error) {
            console.error('Failed to load demo:', error);
            document.getElementById('loading').innerHTML = 
                `<div style="color: red; text-align: center;">
                    <h2>Failed to load demo</h2>
                    <p>${error.message}</p>
                    <p>Check browser console for details</p>
                </div>`;
        }
    </script>
</body>
</html>
