<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pyvista-js Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.css" />
</head>
<body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.js"></script>
    <script>
        stlite.mount(
            {
                requirements: [
                    "numpy"
                ],
                entrypoint: "app.py",
                files: {
                    "app.py": `import streamlit as st

st.title("🌐 pyvista-js Demo")

st.markdown("""
**pyvista-js** - PyVista-like 3D visualization in the browser!

This demo installs pyvista-js directly from GitHub and runs entirely in your browser.
""")

# Install and import
with st.spinner("Installing pyvista-js from GitHub..."):
    try:
        import micropip
        await micropip.install("https://github.com/tkoyama010/pyvista-js/archive/refs/heads/main.zip")
        import pyvista_js as pv
        st.success(f"✅ pyvista-js {pv.__version__} loaded successfully!")
        
        # Sidebar controls
        st.sidebar.header("⚙️ Controls")
        
        geometry = st.sidebar.selectbox(
            "Geometry",
            ["Sphere", "Cube", "Cylinder"]
        )
        
        color = st.sidebar.selectbox(
            "Color",
            ["red", "green", "blue", "yellow", "cyan", "magenta"]
        )
        
        opacity = st.sidebar.slider(
            "Opacity",
            min_value=0.0,
            max_value=1.0,
            value=0.8,
            step=0.1
        )
        
        # Create visualization
        st.header("📊 3D Visualization")
        
        plotter = pv.Plotter()
        
        # Create geometry
        if geometry == "Sphere":
            mesh = pv.Sphere(radius=1.0)
            st.sidebar.info(f"Sphere with {mesh.n_points} points")
        elif geometry == "Cube":
            mesh = pv.Cube()
            st.sidebar.info(f"Cube with {mesh.n_points} points")
        else:
            mesh = pv.Cylinder(radius=0.5, height=2.0)
            st.sidebar.info(f"Cylinder with {mesh.n_points} points")
        
        # Add mesh to plotter
        plotter.add_mesh(mesh, color=color, opacity=opacity)
        
        # Display
        st.write("**Interactive 3D View**")
        pv.pyvista_chart(plotter, height=600)
        
    except Exception as e:
        st.error(f"Failed to load pyvista-js: {e}")
        st.info("This is expected during development. Full functionality coming soon!")

# Information
st.markdown("""
---
### 🎯 Features

- **Interactive 3D**: Rotate, zoom, and pan with mouse/touch
- **PyVista API**: Familiar interface for PyVista users
- **Browser-native**: No server required, runs entirely in browser
- **Powered by vtk.js**: High-performance WebGL rendering

### 🔗 Links

- [pyvista-js on GitHub](https://github.com/tkoyama010/pyvista-js)
- [PyVista](https://www.pyvista.org/)
- [vtk.js](https://kitware.github.io/vtk-js/)
- [stlite](https://github.com/whitphx/stlite)
""")
`
                }
            },
            document.getElementById("root")
        );
    </script>
</body>
</html>
