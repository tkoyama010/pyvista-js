<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pyvista-js Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #root {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.js";
        
        // Load app.py
        const response = await fetch('./app.py');
        const appCode = await response.text();
        
        mount({
            requirements: [],
            entrypoint: "app.py",
            files: {
                "app.py": appCode
            }
        }, document.getElementById("root"));
    </script>
</body>
</html>
