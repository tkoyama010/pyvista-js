<script>
  (function () {
    var container = document.createElement("div");
    container.id = "{{ CONTAINER_ID }}";
    container.style.cssText =
      "width:600px;height:400px;border:2px solid #333;position:relative";
    if (typeof element !== "undefined" && element) {
      element.appendChild(container);
    } else {
      document.body.appendChild(container);
    }

    function doRender() {
      try {
        var fullScreenRenderer =
          vtk.Rendering.Misc.vtkFullScreenRenderWindow.newInstance({
            container: container,
            background: [{{ BACKGROUND_R }}, {{ BACKGROUND_G }}, {{ BACKGROUND_B }}],
          });
        var renderer = fullScreenRenderer.getRenderer();
        var renderWindow = fullScreenRenderer.getRenderWindow();

        {{ LIGHTS_CODE }}

        {{ ACTORS_CODE }}

        {{ SCALAR_BAR_CODE }}

        {{ ENVIRONMENT_CODE }}

        {{ AXES_CODE }}

        renderer.resetCamera();
        {{ CAMERA_CODE }}
        renderWindow.render();
      } catch (e) {
        console.error("Error rendering vtk.js scene:", e);
      }
    }

    if (typeof vtk !== "undefined") {
      doRender();
    } else {
      var script = document.createElement("script");
      script.src = "{{ VTKJS_CDN }}";
      script.onload = doRender;
      document.head.appendChild(script);
    }
  })();
</script>
