<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pyvista-js Streamlit App</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.5.0/build/stlite.css"
    />
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #app {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.5.0/build/stlite.js";

        const appCode = `
import streamlit as st
import streamlit.components.v1 as components
import micropip

# Sidebar configuration
st.sidebar.title("pyvista-js")
st.sidebar.markdown("Interactive 3D visualization in the browser")
st.sidebar.markdown("[Return to JupyterLab](../lab/index.html)")
st.sidebar.markdown("---")

# Sidebar controls
st.sidebar.header("Controls")
geometry = st.sidebar.selectbox("Geometry", ["Bunny", "Sphere", "Cube", "Cylinder"])
color = st.sidebar.selectbox(
    "Color",
    ["gray", "white", "red", "green", "blue", "yellow", "cyan", "magenta"],
)
opacity = st.sidebar.slider("Opacity", min_value=0.0, max_value=1.0, value=0.8, step=0.1)

# Main content
st.title("pyvista-js Streamlit Demo")

st.markdown("""
This is a demonstration of pyvista-js with stlite (Streamlit WASM).
PyVista-like 3D visualization running entirely in your browser!
""")

# Initialize pyvista-js
with st.spinner("Loading pyvista-js..."):
    try:
        await micropip.install('jinja2')
        await micropip.install('lazy-loader')

        try:
            await micropip.install('./src/pyvista_js-0.10.0-py3-none-any.whl')
        except Exception as e:
            st.warning(f"Could not load local wheel: {e}")

        import pyvista_js as pv
        from pyvista_js import examples

        st.success("pyvista-js loaded successfully!")

        st.header("Visualization")

        plotter = pv.Plotter()

        if geometry == "Bunny":
            mesh = examples.download_bunny()
            st.sidebar.info(f"Stanford Bunny with {mesh.n_points} points")
        elif geometry == "Sphere":
            mesh = pv.Sphere(radius=1.0)
            st.sidebar.info(f"Sphere with {mesh.n_points} points")
        elif geometry == "Cube":
            mesh = pv.Cube()
            st.sidebar.info(f"Cube with {mesh.n_points} points")
        else:
            mesh = pv.Cylinder(radius=0.5, height=2.0)
            st.sidebar.info(f"Cylinder with {mesh.n_points} points")

        plotter.add_mesh(mesh, color=color, opacity=opacity)

        html = plotter._renderer._generate_standalone_html()
        components.html(html, height=600)

        st.markdown("""
        ---
        ### Features
        - **Interactive 3D**: Rotate, zoom, and pan with mouse/touch
        - **PyVista API**: Familiar interface for PyVista users
        - **Browser-native**: No server required, runs entirely in browser
        - **Powered by vtk.js**: High-performance WebGL rendering

        ### Links
        - [pyvista-js on GitHub](https://github.com/tkoyama010/pyvista-js)
        - [PyVista](https://www.pyvista.org/)
        - [vtk.js](https://kitware.github.io/vtk-js/)
        """)

    except Exception as e:
        st.error(f"Error loading pyvista-js: {e}")
        st.info("This demo requires pyvista-js to be built and available. Use the sidebar link to return to JupyterLab.")
`;

        mount(
            {
                entrypoint: "app.py",
                files: {
                    "app.py": appCode
                }
            },
            document.getElementById("app")
        );
    </script>
</body>
</html>
