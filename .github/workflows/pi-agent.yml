# Runs the pi coding agent on `/pi` comments on issues and pull requests,
# following ADR-0002 (docs/decisions/0002-use-pi-coding-agent-github-actions.md).
#
# Required repository configuration:
#   secret   PI_TOKEN     API token for the LLM provider
#   variable PI_PROVIDER  LLM provider (e.g. anthropic, openai, google)
#   variable PI_MODEL     Model name (e.g. claude-sonnet-4-5, gpt-5.4)

name: Pi Agent

# ADR-0002 mandates `/pi` comment triggers (issues + pull requests); the job
# allowlist below restricts them to owners and organization members.
on:
  issue_comment:  # zizmor: ignore[dangerous-triggers]
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
  pull_request_review:
    types: [ submitted ]

permissions: {}

concurrency:
  group: pi-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pi-agent:
    # ADR-0002: trigger on comments only, restricted to repository owners
    # and organization members.
    if: |-
      startsWith(github.event.comment.body || github.event.review.body || '', '/pi ')
      && contains(fromJSON('["OWNER", "MEMBER"]'), (github.event.comment || github.event.review).author_association)
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: >-
            ${{
              github.event_name == 'issue_comment' && github.event.issue.pull_request
              && format('refs/pull/{0}/head', github.event.issue.number)
              || github.event.pull_request.head.ref || ''
            }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Pi agent
        uses: shaftoe/pi-coding-agent-action@381f578da466b8d2ef48f0fdb8a940f276fe4c3c  # v2.30.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: ${{ vars.PI_PROVIDER }}
          model: ${{ vars.PI_MODEL }}
          token: ${{ secrets.PI_TOKEN }}
