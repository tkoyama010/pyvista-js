name: Update Stlite Sharing URL

on:
  push:
    branches:
      - main
    paths:
      - "stlite/app.py"
      - ".github/workflows/update-stlite-url.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-stlite-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b9366e64ca80429d5727c0d5b5112fae7fa7f82  # v5
        with:
          python-version: "3.12"

      - name: Check if URL needs update
        id: check
        run: |
          python src/pyvista_js/stlite_url.py check
          echo "needs_update=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Generate new Stlite URL
        id: generate
        if: steps.check.outputs.needs_update == '1'
        run: |
          # For now, we need to manually generate the URL using stlite
          # This step documents the process and provides instructions

          echo "::notice::Stlite source code has changed. New URL needs to be generated."
          echo "::notice::To generate a new URL:"
          echo "::notice::1. Visit https://edit.share.stlite.net/"
          echo "::notice::2. Copy the content from stlite/app.py"
          echo "::notice::3. Paste into the editor and get the shareable URL"
          echo "::notice::4. Update the URL in README.md"

          # Read the current app.py content for reference
          echo "Current stlite/app.py content:"
          cat stlite/app.py

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == '1'
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f  # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update stlite Sharing URL"
          title: "chore: update stlite Sharing URL"
          body: |
            ## Summary

            The stlite app source code (`stlite/app.py`) has been updated.

            ## Action Required

            The Stlite Sharing URL in the README needs to be regenerated to match the new source code.

            ### How to update the URL:

            1. Visit [Stlite Sharing Editor](https://edit.share.stlite.net/)
            2. Copy the content from `stlite/app.py` in this PR
            3. Paste it into the editor
            4. Click "Share" to get the new URL
            5. Update the URL in `README.md`
            6. Commit the changes to this PR

            ### Current Source (`stlite/app.py`):

            ```python
            ${{ steps.generate.outputs.content }}
            ```

            ### References

            - Related to [stlite discussion #1927](https://github.com/whitphx/stlite/discussions/1927#discussioncomment-16301745)
            - This implements the CI pipeline integration suggested by @whitphx

            ---

            **Note:** This PR was automatically generated by the `update-stlite-url.yml` workflow.
          branch: update-stlite-url
          delete-branch: true
          labels: |
            automated
            documentation
          add-paths: |
            README.md
            stlite/app.py
