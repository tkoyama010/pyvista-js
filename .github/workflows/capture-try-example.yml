# Captures an API documentation page after running its "Try it with
# JupyterLite" example, using the pyvista-js CLI. The full-page screenshot
# and problem report are always uploaded as artifacts; when the capture
# detects problems, the CLI opens an issue following the repository's bug
# report template.
#
# Triggers only via workflow_dispatch, so only users with Actions write
# access can invoke it.

name: Capture Try Example

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'API documentation page URL to capture'
        required: true
        type: string

permissions: {}

concurrency:
  group: capture-try-example
  cancel-in-progress: false

jobs:
  capture:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The job only reads the repository and reports via the GitHub API,
          # so the checkout credentials are not persisted to the runner.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Install package and capture dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system pillow numpy
          uv run playwright install --with-deps chromium

      - name: Capture example
        id: capture
        continue-on-error: true
        env:
          DOC_URL: ${{ inputs.url }}
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run pyvista-js capture-api-example "$DOC_URL" \
            --output capture-artifacts --open-issue

      - name: Upload capture artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: capture
          path: capture-artifacts/
          if-no-files-found: error
