# Captures an API documentation page after running its "Try it with
# JupyterLite" example. Full-page screenshots are always uploaded as
# artifacts; when the capture detects problems (failed notebook loads,
# console errors, blank renders), an issue is opened following the
# repository's bug report template.
#
# Triggers only via workflow_dispatch, so only users with Actions write
# access can invoke it.

name: Capture Try Example

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'API documentation page URL to capture'
        required: true
        type: string

permissions: {}

concurrency:
  group: capture-try-example
  cancel-in-progress: false

jobs:
  capture:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The job only reads the repository and reports via the API, so
          # the checkout credentials are not persisted to the runner.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Install Playwright
        run: |
          uv pip install --system playwright pillow numpy
          uv run playwright install --with-deps chromium

      - name: Capture example
        id: capture
        continue-on-error: true
        env:
          DOC_URL: ${{ inputs.url }}
        run: |
          uv run .github/scripts/capture_try_example.py "$DOC_URL" --output capture-artifacts

      - name: Upload capture artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: capture
          path: capture-artifacts/
          if-no-files-found: error

      - name: Open issue on problems
        if: steps.capture.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v7
        with:
          script: |
            const fs = require('fs');
            const problems = JSON.parse(
              fs.readFileSync('capture-artifacts/problems.json', 'utf8')
            );
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[Bug]: JupyterLite example capture failed for ${problems.url}`;
            const body = [
              '### Bug Description',
              '',
              'The automatic "Try it with JupyterLite" capture of an API documentation page detected problems. This issue was automatically opened by the [capture-try-example workflow](' + runUrl + ').',
              '',
              '### Steps to Reproduce',
              '',
              '1. Open ' + problems.url,
              '2. Click "Try it with JupyterLite!"',
              '3. Run all cells',
              '',
              '### Expected Behavior',
              '',
              'The example cells run and the mesh renders on a canvas.',
              '',
              '### Actual Behavior',
              '',
              ...problems.problems.map((p) => '- ' + p),
              '',
              '### Environment Information',
              '',
              '- Workflow run: ' + runUrl,
              '- Operating System: ' + process.platform + ' (GitHub Actions runner)',
              '',
              '### Additional Context',
              '',
              'The full-page screenshot is attached to the workflow run as the `capture` artifact.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug'],
            });
