name: Transifex Sync

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '!docs/pot/**'
      - '!docs/locale/**'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transifex:
    runs-on: ubuntu-latest
    environment: transifex

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: true  # zizmor: ignore[persist-credentials]

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[docs]"

      - name: Generate .pot files
        run: cd docs && make gettext

      - name: Commit updated .pot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/pot/
          if git diff --cached --quiet; then
            echo "No changes to .pot files."
          else
            git commit -m "chore: update pot files"
            git push
          fi

      - name: Install Transifex CLI
        run: |
          curl -fsSL https://github.com/transifex/cli/releases/download/v1.6.17/tx-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin tx

      - name: Generate .tx/config and push sources to Transifex
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: |
          printf '[main]\nhost = https://www.transifex.com\n' > .tx/config
          for pot in $(find docs/pot -name '*.pot' | sort); do
            rel="${pot#docs/pot/}"
            slug=$(printf '%s' "${rel%.pot}" | tr '/._' '-' | sed 's/-\+/-/g' | tr '[:upper:]' '[:lower:]' | cut -c1-50 | sed 's/-*$//')
            printf '\n[o:tkoyama010:p:pyvista-js:r:%s]\nfile_filter = docs/locale/<lang>/LC_MESSAGES/%s.po\nsource_file = %s\nsource_lang = en\ntype = PO\n' \
              "$slug" "${rel%.pot}" "$pot" >> .tx/config
          done
          tx push --source
