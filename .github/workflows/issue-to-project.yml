name: Add issues to Scrum Board

on:
  issues:
    types: [opened]

permissions:
  issues: read
  repository-projects: write

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/users/tkoyama010/projects/6
          github-token: ${{ secrets.PROJECT_TOKEN }}
