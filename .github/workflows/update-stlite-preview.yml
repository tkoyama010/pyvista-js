name: Update stlite Preview GIF
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "stlite/app.py"

permissions: {}

jobs:
  update-stlite-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - run: |
          pip install . playwright "imageio[ffmpeg]" pillow
          playwright install chromium
      - name: Generate Stlite URL from source
        id: stlite-url
        run: |
          # Read the stlite app source
          SOURCE=$(cat stlite/app.py)

          # Encode the source for URL construction
          # Note: Full encoding requires stlite library; this constructs the base URL
          # The actual URL will use the stlite sharing service
          echo "app_source<<EOF" >> $GITHUB_OUTPUT
          echo "$SOURCE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - run: python -m pyvista_js capture-stlite-preview
      - name: Upload stlite preview GIF to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          gh release upload "$TAG" assets/stlite-preview.gif --clobber
