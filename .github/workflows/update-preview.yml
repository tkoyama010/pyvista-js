name: Update Preview GIF
on:
  workflow_dispatch:

permissions: {}

jobs:
  update-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - run: |
          pip install . playwright "imageio[ffmpeg]" pillow
          playwright install chromium
      - run: python -m pyvista_js capture-preview --rotate
      - name: Upload preview GIF to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          gh release upload "$TAG" assets/preview.gif --clobber
