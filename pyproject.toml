[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyvista-js"
version = "0.1.2"
description = "PyVista-like API for vtk.js"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    {name = "Tetsuo Koyama", email = "contact@tetsuo-koyama.dev"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
streamlit = [
    "streamlit>=1.30.0",
]

[project.urls]
Homepage = "https://github.com/tkoyama010/pyvista-js"
Documentation = "https://github.com/tkoyama010/pyvista-js"
Repository = "https://github.com/tkoyama010/pyvista-js"
Issues = "https://github.com/tkoyama010/pyvista-js/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyvista_js"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
