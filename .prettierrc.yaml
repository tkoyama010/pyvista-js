# Prettier configuration for pyvista-js
# Formats JavaScript files and embedded JavaScript in HTML files

# Basic formatting options
printWidth: 100
tabWidth: 2
useTabs: false
semi: true
singleQuote: false
trailingComma: es5
bracketSpacing: true
arrowParens: always

# Plugin configuration
# Note: For Prettier 3.x, plugins are loaded via additional_dependencies in pre-commit
plugins: []

# File-specific overrides
overrides:
  # JavaScript template files containing Jinja2 template syntax (e.g., {{VARIABLE}})
  - files: "src/pyvista_js/js/*.js"
    options:
      parser: jinja-template

  # HTML files with embedded JavaScript
  - files: "*.html"
    options:
      parser: html
