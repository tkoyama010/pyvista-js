[tox]
envlist = py{310,311,312,313,314},lint
isolated_build = True

[testenv]
deps =
    pytest>=7.0
    pytest-cov
commands =
    pytest tests/ --cov=pyvista_js --cov-report=xml --cov-report=term {posargs}

[testenv:lint]
deps =
    ruff>=0.1.0
    mypy>=1.0.0
    numpy>=1.20
commands =
    ruff check .
    ruff format --check .
    mypy src/

[testenv:docs]
deps =
    -r docs/requirements.txt
commands =
    sphinx-build -W -b html docs docs/_build/html
