[tox]
envlist = py{310,311,312},lint
isolated_build = True

[testenv]
deps =
    pytest>=7.0
commands =
    pytest tests/ {posargs}

[testenv:lint]
deps =
    ruff>=0.1.0
commands =
    ruff check .
    ruff format --check .

[testenv:docs]
deps =
    mkdocs
    mkdocs-material
commands =
    mkdocs build
