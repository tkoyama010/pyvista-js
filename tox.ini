[tox]
# SPEC 0: Only test Python versions within 36-month support window
envlist = py{312,313,314},lint
isolated_build = True

[testenv]
deps =
    pytest>=7.0
    pytest-cov
    playwright>=1.40
    pytest-playwright>=0.4.0
commands_pre =
    playwright install chromium
commands =
    pytest tests/ src/ --cov=pyvista_js --cov-report=xml --cov-report=term {posargs}

[testenv:lint]
deps =
    ruff>=0.1.0
    mypy>=1.0.0
    numpy>=2.0
commands =
    ruff check .
    ruff format --check .
    mypy src/

[testenv:docs]
deps =
    -r docs/requirements.txt
commands =
    sphinx-build -W -b html docs docs/_build/html
