<div
  id="tube-filter-config"
  data-tubed-pd-name="{{ TUBED_PD }}"
  data-tube-filter-name="{{ TUBE_FILTER }}"
  data-source-name="{{ SOURCE }}"
  data-radius="{{ RADIUS }}"
  data-n-sides="{{ N_SIDES }}"
  data-capping="{{ CAPPING | tojson }}"
  style="display: none;"
></div>
<script>
  (function () {
    const config = document.getElementById('tube-filter-config').dataset;
    const tubedPdName = config.tubedPdName;
    const tubeFilterName = config.tubeFilterName;
    const sourceName = config.sourceName;
    const inputSource = window[sourceName];

    window[tubeFilterName] = vtk.Filters.General.vtkTubeFilter.newInstance({
      radius: parseFloat(config.radius),
      numberOfSides: parseInt(config.nSides),
      capping: JSON.parse(config.capping)
    });

    if (typeof inputSource.update === 'function') {
      inputSource.update();
    }
    if (typeof inputSource.getOutputPort === 'function') {
      window[tubeFilterName].setInputConnection(inputSource.getOutputPort());
    } else {
      window[tubeFilterName].setInputData(inputSource);
    }
    window[tubeFilterName].update();
    window[tubedPdName] = window[tubeFilterName].getOutputData();
  })();
</script>
