<div
  id="sphere-config"
  data-source-name="{{ SOURCE }}"
  data-tex-map-sphere-name="{{ TEX_MAP_SPHERE }}"
  data-center-x="{{ CENTER_X }}"
  data-center-y="{{ CENTER_Y }}"
  data-center-z="{{ CENTER_Z }}"
  data-radius="{{ RADIUS }}"
  data-theta-resolution="{{ THETA_RESOLUTION }}"
  data-phi-resolution="{{ PHI_RESOLUTION }}"
  style="display: none;"
></div>
<script>
  (function () {
    const config = document.getElementById('sphere-config').dataset;
    const sourceName = config.sourceName;
    const texMapSphereName = config.texMapSphereName;

    window[sourceName] = vtk.Filters.Sources.vtkSphereSource.newInstance({
      center: [parseFloat(config.centerX), parseFloat(config.centerY), parseFloat(config.centerZ)],
      radius: parseFloat(config.radius),
      thetaResolution: parseInt(config.thetaResolution),
      phiResolution: parseInt(config.phiResolution)
    });

    window[texMapSphereName] = vtk.Filters.Texture.vtkTextureMapToSphere.newInstance();
    window[texMapSphereName].setInputConnection(window[sourceName].getOutputPort());
  })();
</script>
