<script>
  const centerX = {{ CENTER_X }};
  const centerY = {{ CENTER_Y }};
  const centerZ = {{ CENTER_Z }};
  const radius = {{ RADIUS }};
  const thetaResolution = {{ THETA_RESOLUTION }};
  const phiResolution = {{ PHI_RESOLUTION }};

  const {{ SOURCE }} = vtk.Filters.Sources.vtkSphereSource.newInstance({
    center: [centerX, centerY, centerZ],
    radius: radius,
    thetaResolution: thetaResolution,
    phiResolution: phiResolution
  });

  const {{ TEX_MAP_SPHERE }} = vtk.Filters.Texture.vtkTextureMapToSphere.newInstance();
  {{ TEX_MAP_SPHERE }}.setInputConnection({{ SOURCE }}.getOutputPort());
</script>
