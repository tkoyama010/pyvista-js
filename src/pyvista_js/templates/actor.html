{{ SOURCE_CODE }}
{% if NORMALS_CODE %}
<script>
  (function() {
    {{ NORMALS_CODE }}
  })();
</script>
{% endif %}
<div id="actor-config"
     data-actor-name="{{ ACTOR }}"
     data-mapper-name="{{ MAPPER }}"
     data-mapper-class="{{ MAPPER_CLASS }}"
     data-color-r="{{ COLOR_R }}"
     data-color-g="{{ COLOR_G }}"
     data-color-b="{{ COLOR_B }}"
     data-opacity="{{ OPACITY }}"
     style="display: none"></div>
<script>
  (function() {
    const config = document.getElementById('actor-config').dataset;
    const actorName = config.actorName;
    const mapperName = config.mapperName;

    window[mapperName] = vtk.Rendering.Core[config.mapperClass].newInstance();
  })();
</script>
{% if MAPPER_SETUP %}
<script>
  (function() {
    {{ MAPPER_SETUP }}
  })();
</script>
{% endif %}
{% if SCALAR_CODE %}
<script>
  (function() {
    {{ SCALAR_CODE }}
  })();
</script>
{% endif %}
<script>
  (function() {
    const config = document.getElementById('actor-config').dataset;
    const actorName = config.actorName;
    const mapperName = config.mapperName;

    window[actorName] = vtk.Rendering.Core.vtkActor.newInstance();
    window[actorName].setMapper(window[mapperName]);
    window[actorName].getProperty().setColor(
      parseFloat(config.colorR),
      parseFloat(config.colorG),
      parseFloat(config.colorB)
    );
    window[actorName].getProperty().setOpacity(parseFloat(config.opacity));
  })();
</script>
