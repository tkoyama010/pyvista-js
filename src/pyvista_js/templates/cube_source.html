<div
  id="cube-config-{{ SOURCE }}"
  data-center-x="{{ CENTER_X }}"
  data-center-y="{{ CENTER_Y }}"
  data-center-z="{{ CENTER_Z }}"
  data-x-length="{{ X_LENGTH }}"
  data-y-length="{{ Y_LENGTH }}"
  data-z-length="{{ Z_LENGTH }}"
  style="display: none;"
></div>
<script>
  const config = document.getElementById('cube-config-{{ SOURCE }}').dataset;
  const {{ SOURCE }} = vtk.Filters.Sources.vtkCubeSource.newInstance({
    center: [parseFloat(config.centerX), parseFloat(config.centerY), parseFloat(config.centerZ)],
    xLength: parseFloat(config.xLength),
    yLength: parseFloat(config.yLength),
    zLength: parseFloat(config.zLength)
  });
</script>
