<div
  id="cone-config"
  data-source-name="{{ SOURCE }}"
  data-center-x="{{ CENTER_X }}"
  data-center-y="{{ CENTER_Y }}"
  data-center-z="{{ CENTER_Z }}"
  data-direction-x="{{ DIRECTION_X }}"
  data-direction-y="{{ DIRECTION_Y }}"
  data-direction-z="{{ DIRECTION_Z }}"
  data-height="{{ HEIGHT }}"
  data-radius="{{ RADIUS }}"
  data-resolution="{{ RESOLUTION }}"
  data-capping="{{ CAPPING | tojson }}"
  style="display: none;"
></div>
<script>
  (function () {
    const config = document.getElementById('cone-config').dataset;
    const sourceName = config.sourceName;

    window[sourceName] = vtk.Filters.Sources.vtkConeSource.newInstance({
      center: [parseFloat(config.centerX), parseFloat(config.centerY), parseFloat(config.centerZ)],
      direction: [
        parseFloat(config.directionX),
        parseFloat(config.directionY),
        parseFloat(config.directionZ)
      ],
      height: parseFloat(config.height),
      radius: parseFloat(config.radius),
      resolution: parseInt(config.resolution),
      capping: JSON.parse(config.capping),
      generateTCoords: true
    });
  })();
</script>
