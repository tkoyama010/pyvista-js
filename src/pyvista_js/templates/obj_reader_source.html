<div
  id="obj-reader-config"
  data-obj-reader-name="{{ OBJ_READER }}"
  data-source-name="{{ SOURCE }}"
  data-obj-base64="{{ OBJ_BASE64 }}"
  style="display: none;"
></div>
<script>
  (function () {
    const config = document.getElementById('obj-reader-config').dataset;
    const objReaderName = config.objReaderName;
    const sourceName = config.sourceName;
    const objBase64 = config.objBase64;
    window[objReaderName] = vtk.IO.Misc.vtkOBJReader.newInstance();
    const objBytes = Uint8Array.from(atob(objBase64), (c) => c.charCodeAt(0));
    window[objReaderName].parseAsArrayBuffer(objBytes.buffer);
    window[sourceName] = window[objReaderName].getOutputData(0);
  })();
</script>
