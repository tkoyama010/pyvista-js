<div
  id="stl-reader-config"
  data-stl-reader-name="{{ STL_READER }}"
  data-source-name="{{ SOURCE }}"
  data-stl-base64="{{ STL_BASE64 }}"
  style="display: none;"
></div>
<script>
  (function () {
    const config = document.getElementById('stl-reader-config').dataset;
    const stlReaderName = config.stlReaderName;
    const sourceName = config.sourceName;
    const stlBase64 = config.stlBase64;
    window[stlReaderName] = vtk.IO.Geometry.vtkSTLReader.newInstance();
    const stlBytes = Uint8Array.from(atob(stlBase64), (c) => c.charCodeAt(0));
    window[stlReaderName].parseAsArrayBuffer(stlBytes.buffer);
    window[sourceName] = window[stlReaderName].getOutputData(0);
  })();
</script>
