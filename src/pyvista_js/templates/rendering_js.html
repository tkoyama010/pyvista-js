<script>
  (function () {
    var container = document.createElement("div");
    container.id = "{{ CONTAINER_ID }}";
    container.style.cssText =
      "width:600px;height:400px;border:2px solid #333;position:relative";
    if (typeof element !== "undefined" && element) {
      element.appendChild(container);
    } else {
      document.body.appendChild(container);
    }

    function doRender() {
      try {
        var renderer = vtk.Rendering.Core.vtkRenderer.newInstance();
        renderer.setBackground(
          {{ BACKGROUND_R }},
          {{ BACKGROUND_G }},
          {{ BACKGROUND_B }},
        );
        var renderWindow = vtk.Rendering.Core.vtkRenderWindow.newInstance();
        renderWindow.addRenderer(renderer);
        var openGLRenderWindow =
          vtk.Rendering.OpenGL.vtkRenderWindow.newInstance();
        renderWindow.addView(openGLRenderWindow);
        openGLRenderWindow.setContainer(container);
        var bbox = container.getBoundingClientRect();
        openGLRenderWindow.setSize(bbox.width || 600, bbox.height || 400);
        var interactor =
          vtk.Rendering.Core.vtkRenderWindowInteractor.newInstance();
        var interactorStyle =
          vtk.Interaction.Style.vtkInteractorStyleTrackballCamera.newInstance();
        interactor.setInteractorStyle(interactorStyle);
        interactor.setView(openGLRenderWindow);
        interactor.initialize();
        interactor.bindEvents(container);

        {{ LIGHTS_CODE }}

        {{ ACTORS_CODE }}

        {{ SCALAR_BAR_CODE }}

        {{ ENVIRONMENT_CODE }}

        {{ AXES_CODE }}

        renderer.resetCamera();
        {{ CAMERA_CODE }}
        renderWindow.render();
      } catch (e) {
        console.error("Error rendering vtk.js scene:", e);
      }
    }

    if (typeof vtk !== "undefined") {
      doRender();
    } else {
      var script = document.createElement("script");
      script.src = "{{ VTKJS_CDN }}";
      script.onload = doRender;
      document.head.appendChild(script);
    }
  })();
</script>
