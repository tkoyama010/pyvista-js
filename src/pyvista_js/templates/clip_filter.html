<script type="module">
// @ts-check
/// <reference path="vtk.d.ts" />

let {{ CLIPPED_PD }}: any;
(function () {
  const src: any = {{ SOURCE }};
  if (typeof src.update === 'function') { src.update(); }
  const pd: any = (typeof src.getOutputData === 'function') ? src.getOutputData(0) : src;
  const inPts: Float32Array = pd.getPoints().getData();
  const inPolys: Int32Array = pd.getPolys().getData();
  const nx: number = {{ NORMAL_X }};
  const ny: number = {{ NORMAL_Y }};
  const nz: number = {{ NORMAL_Z }};
  const ox: number = {{ ORIGIN_X }};
  const oy: number = {{ ORIGIN_Y }};
  const oz: number = {{ ORIGIN_Z }};
  const invert: boolean = {{ INVERT }};
  const nPts: number = inPts.length / 3;
  const distances: Float32Array = new Float32Array(nPts);
  for (let i: number = 0; i < nPts; i++) {
    const px: number = inPts[i * 3];
    const py: number = inPts[i * 3 + 1];
    const pz: number = inPts[i * 3 + 2];
    distances[i] = nx * (px - ox) + ny * (py - oy) + nz * (pz - oz);
  }
  const newPts: number[] = [];
  const newPolys: number[] = [];
  const ptMap: Record<number, number> = {};
  let newPtIdx: number = 0;
  const offset: number = 0;
  let i: number = 0;
  while (i < inPolys.length) {
    const npts: number = inPolys[i];
    const ids: number[] = [];
    for (let j: number = 0; j < npts; j++) { ids.push(inPolys[i + 1 + j]); }
    let allKept: boolean = true;
    for (let k: number = 0; k < npts; k++) {
      const dist: number = distances[ids[k]];
      const keep: boolean = invert ? (dist >= 0) : (dist <= 0);
      if (!keep) { allKept = false; break; }
    }
    if (allKept) {
      newPolys.push(npts);
      for (let j: number = 0; j < npts; j++) {
        const oldId: number = ids[j];
        if (!(oldId in ptMap)) {
          newPts.push(inPts[oldId * 3]);
          newPts.push(inPts[oldId * 3 + 1]);
          newPts.push(inPts[oldId * 3 + 2]);
          ptMap[oldId] = newPtIdx++;
        }
        newPolys.push(ptMap[oldId]);
      }
    }
    i += npts + 1;
  }
  const pts = vtk.Common.Core.vtkPoints.newInstance();
  pts.setData(Float32Array.from(newPts), 3);
  {{ CLIPPED_PD }} = vtk.Common.DataModel.vtkPolyData.newInstance();
  {{ CLIPPED_PD }}.setPoints(pts);
  const polys = vtk.Common.Core.vtkCellArray.newInstance();
  polys.setData(Int32Array.from(newPolys));
  {{ CLIPPED_PD }}.setPolys(polys);
})();
</script>
